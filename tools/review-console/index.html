<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collinson review console</title>
<style>
/* Optional reviewer aid, not part of the service. Layout: control panel on the left, one step at a time on the right. */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --ink: #18212f; --muted: #5b6778; --line: #d9dfe8;
  --accent: #1d5fd1; --accent-ink: #ffffff; --accent-soft: #e4edfc;
  --good: #17794a; --good-soft: #dff3e8; --warn: #9a6200; --warn-soft: #fbeed3;
  --bad: #b3261e; --bad-soft: #fbe3e1; --code: #eef1f6; --note: #fff8e1; --note-line: #ecd98f;
  --mono: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10151d; --panel: #171e29; --ink: #e6ebf2; --muted: #9aa7b9; --line: #2a3443;
    --accent: #6ea4ff; --accent-ink: #0b1220; --accent-soft: #1b2b47;
    --good: #5fd39a; --good-soft: #143326; --warn: #f0be5a; --warn-soft: #3a2c0e;
    --bad: #ff8a80; --bad-soft: #3d1917; --code: #1d2633; --note: #2b2714; --note-line: #5a4f1f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { border-color: var(--bad); color: var(--bad); }
button[disabled] { opacity: .55; cursor: progress; }
code, pre, .mono { font-family: var(--mono); font-size: 13px; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code); padding: 12px; border-radius: 6px; overflow: auto; margin: 0; max-height: 420px; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; padding: 16px; overflow-y: auto; }
.side h1 { font-size: 17px; }
.box { display: flex; flex-direction: column; gap: 8px; }
.status { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.dot.up { background: var(--good); } .dot.down { background: var(--bad); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.steps button { width: 100%; text-align: left; border: 0; background: none; display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; padding: 6px 8px; border-radius: 6px; font-size: 14px; }
.steps button:hover { background: var(--code); }
.steps button[aria-current="true"] { background: var(--accent-soft); font-weight: 600; }
.steps .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.steps .t { color: var(--muted); font-size: 12px; }
.steps .done .n { color: var(--good); }
.try input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); min-width: 0; }
.try .row input:first-child { flex: 1; } .try .row input:last-child { width: 64px; flex: none; text-transform: uppercase; }
.keys { font-size: 12px; color: var(--muted); }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg); }

.main { overflow-y: auto; padding: 24px 32px 64px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head h2 { font-size: 26px; }
.brief { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; color: var(--muted); font-style: italic; max-width: 75ch; }
.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.say { background: var(--note); border-color: var(--note-line); }
.card ul, .card ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.card p { margin: 0; }
.actions { display: flex; flex-direction: column; gap: 8px; }
.action { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.action small { color: var(--muted); }
.confirm { display: inline-flex; gap: 6px; align-items: center; }

.result { min-height: 60px; }
.result .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: var(--code); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.act h3 { font-size: 14px; }
.day { display: grid; grid-template-columns: 26px 86px 1fr 34px; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
.day .rank { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.day .bar { height: 8px; border-radius: 4px; background: var(--code); overflow: hidden; }
.day .bar i { display: block; height: 100%; background: var(--accent); }
.day .score { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.day.na { color: var(--muted); } .day.na .rank { color: var(--muted); }
.reason { grid-column: 2 / -1; color: var(--muted); font-size: 12px; margin-top: -2px; }
.log td { font-size: 12px; }
details > summary { cursor: pointer; font-weight: 600; }
.qa details { border-top: 1px solid var(--line); padding: 8px 0; }
.qa details:first-of-type { border-top: 0; }
.qa p { margin: 6px 0 0; color: var(--muted); max-width: 80ch; }
.tech details { border-top: 1px solid var(--line); padding: 8px 0; }
.tech details:first-of-type { border-top: 0; }
.tech .body { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 4px; max-width: 90ch; }
.tech .body p { margin: 0; } .tech .body pre { max-height: none; }
.tech .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tech .bar button { font-size: 12px; padding: 2px 8px; }
a { color: var(--accent); } a code { color: inherit; }
.diagram { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.diagram svg { display: block; margin: 0 auto; max-width: none; font-family: var(--sans); }
.diagram figcaption { color: var(--muted); font-size: 13px; max-width: 90ch; }
.d-box { fill: var(--panel); stroke: var(--muted); stroke-width: 1.2; }
.d-box.accent { fill: var(--accent-soft); stroke: var(--accent); }
.d-box.pure { stroke-dasharray: 6 4; }
.d-box.ext { fill: var(--code); }
.d-box.good { fill: var(--good-soft); stroke: var(--good); }
.d-box.warn { fill: var(--warn-soft); stroke: var(--warn); }
.d-box.bad { fill: var(--bad-soft); stroke: var(--bad); }
.d-title { fill: var(--ink); font-size: 14px; font-weight: 600; text-anchor: middle; }
.d-line { fill: var(--muted); font-size: 12.5px; text-anchor: middle; }
.d-label { fill: var(--muted); font-size: 12px; font-style: italic; }
.d-arrow { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.d-head { fill: var(--muted); }
.d-curve { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; }
.d-dot { fill: var(--accent); }
.d-axis { stroke: var(--muted); stroke-width: 1; }
.d-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; } .d-grid.solid { stroke-dasharray: none; }
.d-ctitle { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
.d-tick { fill: var(--muted); font-size: 11.5px; } .d-tick.end { text-anchor: end; } .d-tick.mid { text-anchor: middle; }
.d-rname { fill: var(--ink); font-size: 15px; font-weight: 700; }
.d-thead { fill: var(--accent-soft); stroke: var(--muted); stroke-width: 1.2; }
.d-tname { fill: var(--ink); font: 600 13px var(--mono); }
.d-col { fill: var(--ink); font: 12px var(--mono); } .d-col.pk { font-weight: 700; }
.d-type { fill: var(--muted); font: 12px var(--mono); }
.d-mark { fill: var(--accent); font: 700 10.5px var(--sans); text-anchor: end; letter-spacing: .04em; }
.empty { color: var(--muted); }
.nav { display: flex; justify-content: space-between; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; height: auto; } .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .main { padding: 16px; } .cols, .acts { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Control panel">
    <div class="box">
      <span class="label">Control panel</span>
      <h1>Collinson review console</h1>
    </div>

    <div class="box">
      <span class="label">Service</span>
      <div class="status">
        <span class="dot" id="dot-service"></span><span>GraphQL service</span><span id="st-service" class="mono">…</span>
        <span class="dot" id="dot-db"></span><span>PostgreSQL</span><span id="st-db" class="mono">…</span>
      </div>
      <div class="row"><span class="mono" id="st-endpoint" style="color:var(--muted);font-size:12px"></span></div>
      <div class="row"><button id="btn-status">Check now</button></div>
    </div>

    <div class="box">
      <span class="label">Steps</span>
      <ol class="steps" id="steps"></ol>
      <div class="row">
        <button id="btn-prev">← Previous</button>
        <button id="btn-next" class="primary">Next →</button>
      </div>
    </div>

    <div class="box">
      <span class="label">Technical reference</span>
      <ol class="steps" id="refs"></ol>
    </div>

    <form class="box try" id="try">
      <span class="label">Try any place</span>
      <div class="row">
        <input id="try-city" placeholder="City or town" aria-label="City or town" autocomplete="off">
        <input id="try-cc" placeholder="CC" maxlength="2" aria-label="Country code" autocomplete="off">
      </div>
      <button type="submit">Rank seven days</button>
    </form>

    <div class="box">
      <span class="label">View</span>
      <div class="row">
        <button id="btn-clear">Clear results</button>
      </div>
      <div class="keys"><kbd>←</kbd> <kbd>→</kbd> change step</div>
    </div>
  </aside>

  <main class="main"><div class="wrap" id="stage"></div></main>
</div>

<script>
const FORECAST = `query Forecast($input: ForecastInput!) {
  activityForecast(input: $input) {
    __typename
    ... on ActivityForecast {
      location { id name region country latitude longitude timezone }
      startDate
      endDate
      scoringVersion
      activities {
        activity
        days { date availability score rank reason unavailableCode }
      }
      sources { source freshness fetchedAt failureCode reason }
      attribution
    }
    ... on AmbiguousLocation {
      candidates { id name region country timezone }
    }
    ... on LocationNotFound {
      message
    }
  }
}`;
const LOCATIONS = `query Locations($city: String!, $countryCode: String) {
  locations(city: $city, countryCode: $countryCode) {
    id name region country latitude longitude timezone
  }
}`;
const forecast = (input) => JSON.stringify({ query: FORECAST, variables: { input } });
const NAZARE_ID = '2265552';

const REPO = 'https://github.com/NastyGoose/collinson/blob/main/';
const src = (path, line) => `<a href="${REPO}${path}${line ? '#L' + line : ''}" target="_blank" rel="noopener"><code>${path}${line ? ':' + line : ''}</code></a>`;
const code = (text) => `<pre>${text.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</pre>`;
const why = (text) => `<p><b>Why:</b> ${text}</p>`;
const cost = (text) => `<p><b>Trade-off:</b> ${text}</p>`;


const STEPS = [
  {
    title: 'The brief and this walkthrough',
    brief: 'What we’re most interested in is how you work through problem: the decisions you make, the assumptions you commit to, and how you get there.',
    say: [
      'The service is a NestJS GraphQL API. It takes a city or town, gets weather from Open-Meteo, stores it in PostgreSQL and ranks the next seven days for skiing, surfing, outdoor and indoor sightseeing. It has no front end.',
      'This console is an optional reviewer aid and is not part of the service. Every button sends a plain GraphQL POST to the running service, the same requests as the files in <code>examples/</code>, so you can also send them with curl from the README.',
      'Steps 1 to 9 show the service answering live. Steps 10 and 11 cover how the work was done, the assumptions and what was cut, which the brief ranks first.',
      'Each step has an “Under the hood” card with the code, the motivation and the trade-offs. The technical reference in the side panel has the diagrams, technology choices, schema and known weak spots in one place.',
      'Start by checking that the service and the database are up.',
    ],
    point: [
      'The <code>health</code> answer: <code>service</code> and <code>database</code> are reported separately.',
      'The requirement map below: each line of the brief has a step here.',
      'The architecture diagram: one process, three domains, two external systems.',
    ],
    extra: `<div class="scroll"><table>
      <tr><th>The brief asks for</th><th>Where to see it</th></tr>
      <tr><td>A city or town as input</td><td>Steps 2 and 3</td></tr>
      <tr><td>The next 7 days ranked for four activities</td><td>Steps 4 and 5</td></tr>
      <tr><td>Open-Meteo data, persisted, with a refresh policy</td><td>Step 6</td></tr>
      <tr><td>Node.js and GraphQL, no front end</td><td>Every step is one GraphQL request</td></tr>
      <tr><td>A focused submission that reasons well</td><td>Steps 7 to 9</td></tr>
      <tr><td>How you worked, assumptions, what was cut</td><td>Steps 10 and 11</td></tr>
    </table></div>`,
    actions: [
      { label: 'Check health', raw: JSON.stringify({ query: '{ health { service database } }' }), note: 'The smallest proof that the endpoint and PostgreSQL work.' },
    ],
    qa: [
      ['The brief says not to build a front end. What is this page?', 'A reviewer aid in tools/review-console, outside src/. It was added after the service was finished and forwards requests to it unchanged. The submission is the API, the README and the notes; the engineering notes record why this tool exists.'],
      ['Why NestJS?', 'It was my choice (ADR 0001). The work splits into location, forecast and scoring modules, and dependency injection lets tests replace the clock and the HTTP fetch, so every test is deterministic and offline.'],
      ['Why schema-first GraphQL?', 'The Technical Design publishes the exact SDL, so the SDL is the contract. The AI’s first draft proposed code-first, which would have made the contract a generated file. That change is in the engineering notes for 14 November.'],
    ],
  },
  {
    title: 'A city or town as input',
    brief: 'Build a backend service that takes a city or town…',
    say: [
      'A place name is not a place: there are dozens of Springfields. The first design question was what to do with a name that matches several places.',
      'The <code>locations</code> query returns up to five candidates. Each has a stable Open-Meteo ID, a region and an IANA time zone.',
      'Every candidate is stored in PostgreSQL. If you run the search twice, the second answer comes from the stored search, which is kept for 24 hours.',
    ],
    point: [
      'Five Springfields in different states, with different time zones.',
      'The response time of the second run in the run log.',
      'The <code>id</code> field. It is what a client passes back later.',
      'The schema diagram: the three location tables and their keys.',
    ],
    actions: [
      { label: 'Search “Springfield”, US', raw: JSON.stringify({ query: LOCATIONS, variables: { city: 'Springfield', countryCode: 'US' } }), note: 'examples/locations.json' },
      { label: 'Show stored searches and locations', db: true, note: 'Rows in location_searches and locations.' },
    ],
    qa: [
      ['Why at most five candidates?', 'It is enough for a caller to choose from and keeps the answer small. The service asks Open-Meteo for ten and keeps the first five valid, distinct ones, so one bad record does not push out a real fifth candidate.'],
      ['What if geocoding is down?', 'A city search returns a GraphQL error with the code GEOCODING_UNAVAILABLE. A stored ID still works, because it resolves from PostgreSQL without geocoding. An expired search is not served during an outage; that was a deliberate limit.'],
      ['How are two spellings of one city handled?', 'The text is trimmed, NFKC-normalized and lowercased, and the same normalized text is used as the cache key and sent to the provider. A review found the first version sent the raw text, which could ask the provider a different question than the key suggested.'],
    ],
  },
  {
    title: 'Ambiguous names are never guessed',
    brief: 'Where you’d normally check an open question with a product manager, note the question and the assumption you went with.',
    say: [
      'This was one of the open questions: if a caller asks for a forecast for “Madrid”, should the service pick one?',
      'The assumption I committed to is that it never picks silently. The forecast query returns a typed <code>AmbiguousLocation</code> with the candidates, and the caller repeats the query with one ID.',
      'It is a union type, not an error. Ambiguity is a normal outcome, so a client handles it by type.',
      'Run the Madrid request, then click a candidate to finish the flow by ID.',
    ],
    point: [
      '<code>__typename: AmbiguousLocation</code> in the raw response.',
      'Madrid, Madridejos, Madridanos: similar names, different places.',
      'The follow-up by ID does not call geocoding at all.',
    ],
    actions: [
      { label: 'Forecast for “Madrid”, ES', raw: forecast({ city: 'Madrid', countryCode: 'ES' }), note: 'examples/forecast-ambiguous.json. Then click a candidate.' },
      { label: 'Forecast for a place that does not exist', raw: forecast({ city: 'Qqzzxxyy' }), note: 'Returns LocationNotFound, also a type and not an error.' },
    ],
    qa: [
      ['Why not return the most populous match?', 'It would be right most of the time and silently wrong the rest. A wrong city gives a confident, wrong ranking. Returning candidates costs the client one more request.'],
      ['Why a union instead of GraphQL errors?', 'Errors are for requests the service could not serve. “Several places match” and “nothing matches” are valid answers, and the union makes the client handle each case explicitly.'],
      ['Why does the not-found message not repeat the city?', 'Error and not-found messages never echo submitted text. That was hardening work in ARC-59 after a probe showed input being reflected.'],
    ],
  },
  {
    title: 'Seven days ranked for four activities',
    brief: '…ranks how good the next 7 days will be for each of these activities: skiing, surfing, outdoor sightseeing, indoor sightseeing.',
    say: [
      'This is the main request. Nazaré in Portugal is a surf town, so all four activities have data.',
      'I read “rank the next seven days for each activity” as four separate rankings of the same seven dates. Days are not compared across activities.',
      '“Next seven days” starts tomorrow, in the location’s own time zone. Today is left out because part of it is already over and it would be compared against full days.',
      'Each day has a score from 0 to 100, a rank and a sentence that cites the inputs behind the score.',
      'Indoor sightseeing rises as outdoor conditions get worse. Compare the best indoor day with the worst outdoor day.',
    ],
    point: [
      'Four groups, seven days each, rank 1 first.',
      '<code>startDate</code> is tomorrow in Europe/Lisbon.',
      'The reason line under each day: real numbers and the factor that lowers the score most.',
      'Skiing scores 0 with the reason “No snow on the ground”. It is a measured zero, not missing data.',
      '<code>scoringVersion: v1</code> and the Open-Meteo attribution in the raw response.',
      'The request flow diagram: the seven stages behind this one query.',
    ],
    actions: [
      { label: 'Forecast for Nazaré, PT', raw: forecast({ city: 'Nazaré', countryCode: 'PT' }), note: 'examples/forecast-by-city.json' },
    ],
    qa: [
      ['Why does the window start tomorrow?', 'Seven complete local days. A partial today would be scored on fewer hours than the others. The service asks Open-Meteo for eight days to cover it. This is the 13 November entry in the engineering notes.'],
      ['Why 09:00 to 18:00?', 'The score is for a generic daytime visitor. Each date uses nine local hours. Precipitation is summed from 10:00 to 18:00 because each Open-Meteo value covers the hour before its timestamp.'],
      ['What about time zones and DST?', 'The request time is frozen before anything else, and the dates are derived in the location’s IANA zone from the provider’s Unix timestamps. E2E scenarios cover local midnight and both DST changes.'],
      ['Why do ties not share a rank?', 'Ties on the rounded score are broken by the earlier date, so ranks are always 1 to 7 and the output is deterministic.'],
    ],
  },
  {
    title: 'Scores you can explain',
    brief: 'The decisions you make, the assumptions you commit to, and how you get there.',
    say: [
      'The brief gives no formula, so the formula is an assumption. I made it simple, deterministic and versioned, and wrote it down in ADR 0005.',
      'Val Thorens is a ski resort at 2,300 m. The same function gives skiing a real score there, and surfing is unavailable.',
      'Skiing is 50% snow depth, 30% temperature with the best at −5 °C, and 20% wind. No snow on the ground means 0.',
      'The scoring code is a pure function with no I/O. It takes the date window and the normalized weather and returns the four rankings. A lint rule in CI stops it importing anything else.',
      'The scores describe weather suitability. They are not safety advice and say nothing about lifts or beaches.',
    ],
    point: [
      'The scoring diagram: every curve is drawn to scale from the constants in the code.',
      'Skiing reasons cite snow depth, temperature and wind.',
      'Surfing: seven unavailable days with a code, still seven entries.',
      'The same location answers all four activities from two independent sources.',
    ],
    actions: [
      { label: 'Forecast for Val Thorens, FR', raw: forecast({ city: 'Val Thorens', countryCode: 'FR' }), note: 'A ski resort. Live values change with the weather.' },
    ],
    qa: [
      ['How were the weights picked?', 'They are illustrative v1 heuristics, and the ADR says so. The focus was that they are explainable, tested at the breakpoints and versioned, so they can be calibrated later without breaking stored data.'],

/* ---------- diagrams (inline SVG, drawn from the theme tokens) ---------- */
function box(x, y, w, title, lines = [], kind = '') {
  const h = 30 + lines.length * 17 + (lines.length ? 6 : 0);
  const cx = x + w / 2;
  return { x, y, w, h, cx, bottom: y + h, right: x + w, midY: y + h / 2,
    svg: `<rect class="d-box ${kind}" x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/><text class="d-title" x="${cx}" y="${y + 20}">${esc(title)}</text>${lines.map((l, i) => `<text class="d-line" x="${cx}" y="${y + 40 + i * 17}">${esc(l)}</text>`).join('')}` };
}
function arrow(x1, y1, x2, y2, label, dx = 8, dy = -6) {
  return `<line class="d-arrow" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#d-head)"/>${label ? `<text class="d-label" x="${(x1 + x2) / 2 + dx}" y="${(y1 + y2) / 2 + dy}">${esc(label)}</text>` : ''}`;
}
function diagram(width, height, title, parts, caption) {
  return `<figure class="diagram"><div class="scroll"><svg viewBox="0 0 ${width} ${height}" style="width:100%;max-width:${width}px;min-width:${Math.round(width * 0.7)}px;height:auto" role="img" aria-label="${esc(title)}">
    <defs><marker id="d-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M0 0L10 5L0 10z"/></marker></defs>
    ${parts.map((p) => (typeof p === 'string' ? p : p.svg)).join('')}</svg></div><figcaption>${caption}</figcaption></figure>`;
}

}

function refreshFlowDiagram() {

    arrow(read.right, read.midY, fresh.x, fresh.midY),

function dbTable(x, y, name, rows) {
  const w = 300, head = 28, rh = 20;
  const h = head + rows.length * rh + 6;
  const rowY = (i) => y + head + i * rh + 14;
  return { x, y, w, h, right: x + w, bottom: y + h, cx: x + w / 2, rowY,
    svg: `<rect class="d-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/><path class="d-thead" d="M${x} ${y + head}V${y + 7}a7 7 0 0 1 7-7H${x + w - 7}a7 7 0 0 1 7 7V${y + head}z"/>
      <text class="d-tname" x="${x + 10}" y="${y + 19}">${name}</text>
      ${rows.map(([col, type, marks = ''], i) => `<text class="d-col${marks.includes('PK') ? ' pk' : ''}" x="${x + 10}" y="${rowY(i) + 4}">${col}</text><text class="d-type" x="${x + 160}" y="${rowY(i) + 4}">${type}</text><text class="d-mark" x="${x + w - 8}" y="${rowY(i) + 4}">${marks}</text>`).join('')}` };
}
const link = (points, label, lx, ly) => `<polyline class="d-arrow" points="${points.map((p) => p.join(',')).join(' ')}" marker-end="url(#d-head)"/>${label ? `<text class="d-label" x="${lx}" y="${ly}">${label}</text>` : ''}`;

function schemaDiagram() {
  const TS = 'TIMESTAMPTZ(3)';
  const searches = dbTable(20, 20, 'location_searches', [
    ['query', 'TEXT', 'PK'], ['country_code', 'TEXT', 'PK'], ['fetched_at', TS], ['expires_at', TS, 'IDX'],
  ]);
  const results = dbTable(20, 220, 'location_search_results', [
    ['query', 'TEXT', 'PK FK'], ['country_code', 'TEXT', 'PK FK'], ['position', 'INTEGER', 'PK'], ['location_id', 'TEXT', 'FK IDX'],
  ]);
  const locations = dbTable(385, 20, 'locations', [
    ['id', 'TEXT', 'PK'], ['name', 'TEXT'], ['country', 'TEXT'], ['region', 'TEXT null'], ['latitude', 'DOUBLE'], ['longitude', 'DOUBLE'],
    ['timezone', 'TEXT'], ['created_at', TS], ['updated_at', TS],
  ]);
  const snapshots = dbTable(750, 20, 'forecast_snapshots', [
    ['location_id', 'TEXT', 'PK FK'], ['source', 'weather_source', 'PK'], ['schema_version', 'INTEGER', 'PK'],
    ['fetched_at', TS], ['coverage_start', TS], ['coverage_end', TS],
    ['requested_latitude', 'DOUBLE'], ['requested_longitude', 'DOUBLE'], ['returned_latitude', 'DOUBLE'], ['returned_longitude', 'DOUBLE'],
    ['timezone', 'TEXT'], ['units', 'JSONB'], ['hourly', 'JSONB'], ['created_at', TS], ['updated_at', TS],
  ]);
  const idY = locations.rowY(0);
  return diagram(1070, 370, 'Database schema', [searches, results, locations, snapshots,
    link([[results.cx, results.y], [results.cx, searches.bottom]], 'N : 1 · CASCADE', results.cx + 10, (results.y + searches.bottom) / 2 + 4),
    link([[results.right, results.rowY(3)], [352, results.rowY(3)], [352, idY], [locations.x, idY]], 'N : 1 · RESTRICT', 330, results.rowY(3) + 22),
    link([[snapshots.x, snapshots.rowY(0)], [locations.right, idY]], 'N : 1', locations.right + 14, idY - 8),
    `<text class="d-label" x="${locations.right + 4}" y="${idY + 20}">CASCADE</text>`,
  ], 'Arrows point from the foreign key to the row it references, with the delete rule. <b>PK</b> columns form the primary key, and composite keys span several rows. <b>IDX</b> marks the two secondary indexes: <code>expires_at</code> for the purge and <code>location_id</code> for the foreign key. <code>weather_source</code> is a PostgreSQL enum (ATMOSPHERIC, MARINE). A location has at most one snapshot per source and schema version, and a search has at most five result rows.');
}

/* One component curve, drawn to scale from the breakpoint table in activity-scoring.constants.ts. */
function curve(x, y, title, bps, min, max, yLabels) {
  const W = 220, H = 64, px = x + 26, py = y + 22;
  const sx = (v) => px + ((v - min) / (max - min)) * W;
  const sy = (s) => py + H - (s / 100) * H;
  const pts = [[min, bps[0][1]], ...bps, [max, bps[bps.length - 1][1]]];
  const [top, bottom] = yLabels ?? ['100', '0'];
  return `<text class="d-ctitle" x="${px}" y="${y + 12}">${esc(title)}</text>
    <line class="d-grid" x1="${px}" y1="${py}" x2="${px + W}" y2="${py}"/>
    <line class="d-axis" x1="${px}" y1="${py}" x2="${px}" y2="${py + H}"/><line class="d-axis" x1="${px}" y1="${py + H}" x2="${px + W}" y2="${py + H}"/>
    <text class="d-tick end" x="${px - 5}" y="${py + 4}">${top}</text><text class="d-tick end" x="${px - 5}" y="${py + H + 4}">${bottom}</text>
    <polyline class="d-curve" points="${pts.map(([v, s]) => `${sx(v).toFixed(1)},${sy(s).toFixed(1)}`).join(' ')}"/>
    ${bps.map(([v, s]) => `<circle class="d-dot" cx="${sx(v).toFixed(1)}" cy="${sy(s).toFixed(1)}" r="3.2"/><text class="d-tick mid" x="${sx(v).toFixed(1)}" y="${py + H + 15}">${String(v).replace('-', '−')}</text>`).join('')}`;
}
function scoringDiagram() {
  const steps = [
    ['9 local hours', 'per field, per date'], ['Aggregate', 'mean, sum, max or median'], ['Component 0 to 100', 'lines between breakpoints'],
    ['Weighted sum', '50% + 30% + 20%'], ['Round, then rank', 'halves up; ties: earlier date'],
  ].map(([t, l], i) => box(30 + i * 200, 10, 180, t, [l], i === 2 ? 'accent' : ''));
  const rows = [
    ['Outdoor sightseeing', ['best at 20 °C,', 'dry and calm'], [
      ['50% · temperature, mean (°C)', [[0, 0], [20, 100], [35, 0]], -5, 40],
      ['30% · precipitation, sum (mm)', [[0, 100], [8, 0]], 0, 10],
      ['20% · wind, max (km/h)', [[10, 100], [40, 0]], 0, 50]]],
    ['Skiing', ['0 when there is no', 'snow on the ground'], [
      ['50% · snow depth, mean (m)', [[0, 0], [0.3, 100]], 0, 0.4],
      ['30% · temperature, mean (°C)', [[-20, 0], [-5, 100], [5, 0]], -25, 10],
      ['20% · wind, max (km/h)', [[10, 100], [45, 0]], 0, 55]]],
    ['Surfing', ['needs a marine grid', 'point within 25 km'], [
      ['50% · wave height, median (m)', [[0, 0], [1.2, 100], [3, 0]], 0, 3.5],
      ['30% · wave period, median (s)', [[4, 0], [12, 100]], 0, 16],
      ['20% · wind, max (km/h)', [[10, 100], [40, 0]], 0, 50]]],
    ['Indoor sightseeing', ['rises as outdoor', 'conditions worsen'], [
      ['from the unrounded outdoor score', [[0, 100], [100, 50]], 0, 100]]],
  ];
  const parts = [...steps, ...steps.slice(1).map((s, i) => arrow(steps[i].right, steps[i].midY, s.x, s.midY))];
  rows.forEach(([name, notes, charts], r) => {
    const y = 92 + r * 130;
    parts.push(`<line class="d-grid solid" x1="20" y1="${y - 10}" x2="1020" y2="${y - 10}"/><text class="d-rname" x="20" y="${y + 38}">${name}</text>${notes.map((n, i) => `<text class="d-tick" x="20" y="${y + 58 + i * 16}">${n}</text>`).join('')}`);
    charts.forEach(([title, bps, min, max], c) => parts.push(curve(200 + c * 280, y, title, bps, min, max)));
  });
  const iy = 92 + 3 * 130;
  parts.push(`<text class="d-tname" x="506" y="${iy + 50}">indoor = 50 + 0.5 × (100 − outdoor)</text><text class="d-tick" x="506" y="${iy + 72}">outdoor 100 gives indoor 50 · outdoor 0 gives indoor 100</text><text class="d-tick" x="506" y="${iy + 90}">same three inputs as outdoor sightseeing</text>`);
  return diagram(1040, 615, 'Scoring v1 formulas', parts, 'Scoring v1, drawn to scale from the breakpoint tables in <code>activity-scoring.constants.ts</code>. Each curve turns one aggregated measurement into a component score from 0 to 100; the numbers under each axis are the breakpoints, and values outside them keep the end score. The three components are combined with the weights shown. The weights and breakpoints are illustrative assumptions (ADR 0005), not fitted to data.');
}

/* ---------- state ---------- */
const store = {

  set(key, value) { try { localStorage.setItem('review.' + key, JSON.stringify(value)); } catch { /* optional */ } },
};
let current = Math.min(store.get('step', 0), STEPS.length - 1);
const visited = new Set(store.get('visited', []));
const results = new Map();   // step index -> { html }
const logs = new Map();      // step index -> rows
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- API ---------- */
async function api(path, body) {
  const response = await fetch(path, body === undefined ? undefined : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  return response.json();
}
async function refreshStatus() {
  try {
    const s = await api('/api/status');
    $('st-service').textContent = s.service; $('dot-service').className = 'dot ' + (s.service === 'UP' ? 'up' : 'down');
    $('st-db').textContent = s.database; $('dot-db').className = 'dot ' + (s.database === 'UP' ? 'up' : 'down');
    $('st-endpoint').textContent = s.endpoint;
  } catch {
    $('st-service').textContent = '?'; $('st-db').textContent = '?';
    $('dot-service').className = $('dot-db').className = 'dot down';
    $('st-endpoint').textContent = 'The console server is not running.';

}

/* ---------- renderers ---------- */
const weekday = (date) => new Date(date + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
const ACTIVITY = { SKIING: 'Skiing', SURFING: 'Surfing', OUTDOOR_SIGHTSEEING: 'Outdoor sightseeing', INDOOR_SIGHTSEEING: 'Indoor sightseeing' };
const freshClass = { FRESH: 'good', STALE: 'warn', UNAVAILABLE: 'bad' };

function renderForecast(f) {
  const loc = f.location;
  const sources = f.sources.map((s) => `<span class="chip ${freshClass[s.freshness]}">${esc(s.source)} · ${esc(s.freshness)}${s.fetchedAt ? ' · fetched ' + esc(s.fetchedAt.slice(11, 23)) + ' UTC' : ''}${s.failureCode ? ' · ' + esc(s.failureCode) : ''}</span>`).join('');
  const acts = f.activities.map((a) => `<div class="card act"><h3>${esc(ACTIVITY[a.activity] ?? a.activity)}</h3>${a.days.map((d) => d.availability === 'AVAILABLE'
    ? `<div class="day"><span class="rank">#${d.rank}</span><span>${esc(weekday(d.date))}</span><span class="bar"><i style="width:${d.score}%"></i></span><span class="score">${d.score}</span><span class="reason">${esc(d.reason)}</span></div>`
    : `<div class="day na"><span class="rank">–</span><span>${esc(weekday(d.date))}</span><span><span class="chip">${esc(d.unavailableCode)}</span></span><span class="score">–</span><span class="reason">${esc(d.reason)}</span></div>`).join('')}</div>`).join('');
  return `<div class="meta"><strong>${esc(loc.name)}</strong><span>${esc([loc.region, loc.country].filter(Boolean).join(', '))}</span>
      <span class="chip accent">${esc(loc.timezone)}</span><span class="chip">${esc(f.startDate)} to ${esc(f.endDate)}</span>
      <span class="chip">scoring ${esc(f.scoringVersion)}</span><span class="chip">id ${esc(loc.id)}</span></div>
    <div class="meta">${sources}</div><div class="acts">${acts}</div>
    <div class="empty" style="font-size:12px">${esc(f.attribution)}</div>`;
}
function renderCandidates(list, withButton) {
  return `<div class="scroll"><table><tr><th>ID</th><th>Name</th><th>Region</th><th>Country</th><th>Time zone</th>${withButton ? '<th></th>' : ''}</tr>${list.map((c) =>
    `<tr><td class="mono">${esc(c.id)}</td><td>${esc(c.name)}</td><td>${esc(c.region)}</td><td>${esc(c.country)}</td><td>${esc(c.timezone)}</td>${withButton ? `<td><button data-pick="${esc(c.id)}" data-name="${esc(c.name)}">Forecast this one</button></td>` : ''}</tr>`).join('')}</table></div>`;
}
function renderGraphql(answer) {
  if (!answer.reachable) return { html: `<div class="meta"><span class="chip bad">No answer</span></div><p>${esc(answer.error)}</p>`, summary: 'service not reachable' };
  const body = answer.body;
  const head = `<span class="chip ${answer.status < 400 ? 'good' : 'warn'}">HTTP ${answer.status}</span><span class="chip accent">${answer.ms} ms</span>`;
  let view = '', summary = '';
  if (body?.errors) {
    view = body.errors.map((e) => `<div class="meta"><span class="chip bad">${esc(e.extensions?.code ?? 'ERROR')}</span>${e.extensions && 'field' in e.extensions ? `<span class="chip">field: ${esc(e.extensions.field ?? 'null')}</span>` : ''}<span>${esc(e.message)}</span></div>`).join('');
    summary = body.errors.map((e) => e.extensions?.code).join(', ');
  } else if (body?.data?.health) {
    const h = body.data.health;
    view = `<div class="meta"><span class="chip ${h.service === 'UP' ? 'good' : 'bad'}">service ${esc(h.service)}</span><span class="chip ${h.database === 'UP' ? 'good' : 'bad'}">database ${esc(h.database)}</span></div>`;
    summary = `service ${h.service}, database ${h.database}`;
  } else if (body?.data?.locations) {
    const list = body.data.locations;
    view = list.length ? renderCandidates(list, false) : '<p class="empty">No matches (an empty list, not an error).</p>';
    summary = `${list.length} candidates`;
  } else if (body?.data?.activityForecast) {
    const f = body.data.activityForecast;
    if (f.__typename === 'ActivityForecast') {
      view = renderForecast(f);
      summary = f.location.name + ' · ' + f.sources.map((s) => `${s.source} ${s.freshness}${s.fetchedAt ? ' ' + s.fetchedAt.slice(11, 23) : ''}`).join(' · ');
    } else if (f.__typename === 'AmbiguousLocation') {
      view = `<div class="meta"><span class="chip warn">AmbiguousLocation</span><span>${f.candidates.length} candidates. Choose one to repeat the query by ID.</span></div>` + renderCandidates(f.candidates, true);
      summary = `AmbiguousLocation, ${f.candidates.length} candidates`;
    } else {
      view = `<div class="meta"><span class="chip warn">${esc(f.__typename)}</span><span>${esc(f.message)}</span></div>`;
      summary = f.__typename;
    }
  }
  const raw = typeof body === 'string' ? body : JSON.stringify(body, null, 2);
  return { html: `<div class="meta">${head}</div>${view}<details><summary>Raw response</summary><pre>${esc(raw)}</pre></details>`, summary, status: answer.status, ms: answer.ms };
}
const stamp = (v) => (v ? String(v).replace('T', ' ').slice(0, 19) + 'Z' : '');
function renderDb(db) {
  const t = (title, cols, rows) => `<h3 style="font-size:14px">${title} <span class="empty">(${rows.length} most recent)</span></h3><div class="scroll"><table><tr>${cols.map((c) => `<th>${c[0]}</th>`).join('')}</tr>${rows.map((r) => `<tr>${cols.map((c) => `<td class="${c[2] ?? ''}">${esc(c[1](r))}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="empty">No rows</td></tr>`}</table></div>`;
  return t('forecast_snapshots', [['Location', (r) => `${r.name} (${r.location_id})`], ['Source', (r) => r.source], ['Schema', (r) => 'v' + r.schema_version], ['Fetched at', (r) => stamp(r.fetched_at)], ['Covers from', (r) => stamp(r.coverage_start)], ['Covers to', (r) => stamp(r.coverage_end)], ['Grid point', (r) => `${r.returned_latitude.toFixed(2)}, ${r.returned_longitude.toFixed(2)}`], ['Hours', (r) => r.hours, 'num'], ['Size', (r) => (r.bytes / 1024).toFixed(1) + ' kB', 'num']], db.snapshots)
    + t('location_searches', [['Query', (r) => r.query], ['Country', (r) => r.country_code || '(any)'], ['Results', (r) => r.results, 'num'], ['Fetched at', (r) => stamp(r.fetched_at)], ['Expires at', (r) => stamp(r.expires_at)]], db.searches)
    + t('locations', [['ID', (r) => r.id], ['Name', (r) => r.name], ['Region', (r) => r.region], ['Country', (r) => r.country], ['Time zone', (r) => r.timezone], ['Stored at', (r) => stamp(r.created_at)]], db.locations);
}

/* ---------- running actions ---------- */
function addLog(step, label, http, ms, summary) {
  const rows = logs.get(step) ?? [];
  rows.push({ at: new Date().toLocaleTimeString('en-GB'), label, http, ms, summary });
  logs.set(step, rows);
}
function show(step, html) { results.set(step, html); if (step === current) paintResult(); }
async function runGraphql(step, label, raw) {
  const answer = await api('/api/graphql', { raw });
  const out = renderGraphql(answer);
  addLog(step, label, out.status ?? '–', out.ms ?? answer.ms, out.summary);
  show(step, out.html);
}
async function runAction(step, action, button) {
  button.disabled = true;
  const before = button.textContent; button.textContent = 'Running…';
  try {
    if (action.raw !== undefined) await runGraphql(step, action.tag ? `${action.label}` : action.label, action.raw);
    else if (action.db) { show(step, renderDb(await api('/api/db'))); addLog(step, action.label, '–', '–', 'read from PostgreSQL'); }
    else if (action.reset) { const r = await api('/api/reset', { locationId: action.reset }); addLog(step, action.label, '–', '–', `${r.deleted} snapshot rows deleted`); show(step, `<div class="meta"><span class="chip warn">${r.deleted} rows deleted</span><span>The next request has to call Open-Meteo.</span></div>`); }
    else if (action.run) { const r = await api('/api/run', { name: action.run }); addLog(step, action.label, '–', r.ms, `exit code ${r.exitCode}`); show(step, `<div class="meta"><span class="chip ${r.exitCode === 0 ? 'good' : 'bad'}">${r.exitCode === 0 ? 'Passed' : 'Failed, exit code ' + r.exitCode}</span><span class="chip accent">${(r.ms / 1000).toFixed(1)} s</span><code>${esc(r.command)}</code></div><pre>${esc(r.output)}</pre>`); }
  } catch (error) {
    show(step, `<div class="meta"><span class="chip bad">Console server error</span><span>${esc(error.message)}. Is <code>npm run review:console</code> still running?</span></div>`);
  } finally { button.disabled = false; button.textContent = before; refreshStatus(); }
}

    ${(r.diagrams ?? []).map(([t, draw]) => `<div class="card"><span class="label">${t}</span>${draw()}</div>`).join('')}
    ${r.sections.length ? techCard('Details', r.sections, true) : ''}
    <div class="nav"><button data-back="1">← Back to step ${current + 1}: ${esc(STEPS[current].title)}</button><span></span></div>`;
  document.querySelector('.main').scrollTop = 0;
}
function openRef(index) { refPage = index; paintRef(); }
function paintResult() {
  const box = $('result'); if (!box) return;
  const rows = logs.get(current) ?? [];
  box.innerHTML = (results.get(current) ?? '<p class="empty">Nothing run yet. Use the buttons above.</p>')
    + (rows.length ? `<details open><summary>Run log</summary><div class="scroll"><table class="log"><tr><th>Time</th><th>Request</th><th>HTTP</th><th class="num">ms</th><th>Result</th></tr>${rows.map((r) => `<tr><td class="mono">${r.at}</td><td>${esc(r.label)}</td><td>${r.http}</td><td class="num">${r.ms}</td><td class="mono">${esc(r.summary)}</td></tr>`).join('')}</table></div></details>` : '');
}
function paint() {
  const s = STEPS[current];
  visited.add(current); store.set('visited', [...visited]); store.set('step', current);
  paintSteps();
  const list = (items) => `<ul>${items.map((x) => `<li>${x}</li>`).join('')}</ul>`;
  $('stage').innerHTML = `
    <div class="head"><div><span class="label">Step ${current + 1} of ${STEPS.length}</span><h2>${esc(s.title)}</h2></div></div>
    <div class="brief"><span class="label" style="font-style:normal">From the brief</span><br>“${esc(s.brief)}”</div>
    <div class="cols notes">
      <div class="card say"><span class="label">What this shows</span>${list(s.say)}</div>
      <div class="card"><span class="label">What to look at</span>${list(s.point)}</div>
    </div>
    ${DIAGRAMS[current] ? `<div class="card"><span class="label">Diagram</span>${DIAGRAMS[current]()}</div>` : ''}
    ${s.extra ? `<div class="card">${s.extra}</div>` : ''}
    ${s.actions.length ? `<div class="card"><span class="label">Run</span><div class="actions">${s.actions.map((a, i) => `<div class="action"><span><button class="${a.reset ? 'danger' : 'primary'}" data-action="${i}">${esc(a.label)}</button></span><small>${esc(a.note ?? '')}</small></div>`).join('')}</div></div>
    <div class="card result" id="result" aria-live="polite"></div>` : ''}
    ${TECH[current] ? techCard('Under the hood: code, motivation, trade-offs', TECH[current], false) : ''}
    <div class="card qa notes"><span class="label">Questions you might have</span>${s.qa.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div>
    <div class="nav"><button data-go="-1" ${current === 0 ? 'disabled' : ''}>← ${current ? esc(STEPS[current - 1].title) : 'Start'}</button><button class="primary" data-go="1" ${current === STEPS.length - 1 ? 'disabled' : ''}>${current < STEPS.length - 1 ? esc(STEPS[current + 1].title) : 'End'} →</button></div>`;
  paintResult();
  document.querySelector('.main').scrollTop = 0;
}
function go(index) { refPage = null; current = Math.max(0, Math.min(STEPS.length - 1, index)); paint(); }

/* ---------- events ---------- */
$('stage').addEventListener('click', (event) => {
  const b = event.target.closest('button'); if (!b) return;
  if (b.dataset.tech) return b.closest('.tech').querySelectorAll('details').forEach((d) => { d.open = b.dataset.tech === 'open'; });
  if (b.dataset.back) return go(current);
  if (b.dataset.go) return go(current + Number(b.dataset.go));
  if (b.dataset.pick) return runAction(current, { label: `By ID: ${b.dataset.name} (${b.dataset.pick})`, raw: forecast({ locationId: b.dataset.pick }) }, b);
  if (b.dataset.action === undefined) return;
  const action = STEPS[current].actions[Number(b.dataset.action)];
  if (action.reset && b.dataset.armed !== 'yes') {   // in-page confirmation for the one destructive button
    b.dataset.armed = 'yes'; b.textContent = 'Click again to delete';
    setTimeout(() => { if (b.dataset.armed === 'yes') { b.dataset.armed = ''; b.textContent = action.label; } }, 4000);
    return;
  }
  b.dataset.armed = '';
  runAction(current, action, b).then(() => { if (action.reset) b.textContent = action.label; });
});
$('steps').addEventListener('click', (event) => { const b = event.target.closest('button[data-step]'); if (b) go(Number(b.dataset.step)); });
$('refs').addEventListener('click', (event) => { const b = event.target.closest('button[data-ref]'); if (b) openRef(Number(b.dataset.ref)); });
const step = (delta) => go(refPage === null ? current + delta : current);   // from a reference page, return to the step
$('btn-prev').onclick = () => step(-1);
$('btn-next').onclick = () => step(1);
$('btn-status').onclick = refreshStatus;
$('btn-clear').onclick = () => { results.clear(); logs.clear(); visited.clear(); go(current); };
$('try').addEventListener('submit', (event) => {
  event.preventDefault();
  const city = $('try-city').value.trim(); const cc = $('try-cc').value.trim().toUpperCase();
  if (!city) return $('try-city').focus();
  const input = cc ? { city, countryCode: cc } : { city };
  const button = event.submitter ?? $('try').querySelector('button');
  if (refPage !== null) go(current);
  if (!STEPS[current].actions.length) go(3);
  runAction(current, { label: `Try: ${city}${cc ? ', ' + cc : ''}`, raw: forecast(input) }, button);
});

document.addEventListener('keydown', (event) => {
  if (event.target.closest('input') || event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.key === 'ArrowRight') step(1);
  else if (event.key === 'ArrowLeft') step(-1);
});

paint(); refreshStatus(); setInterval(refreshStatus, 15000);
</script>
</body>
</html>
