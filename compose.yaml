# Local PostgreSQL for development and tests. The defaults are local-only and
# match .env.example; override any of them in .env (Compose reads it too).
name: collinson

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collinson}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collinson}
      POSTGRES_DB: ${POSTGRES_DB:-collinson}
    ports:
      # Bound to loopback only; not reachable from other machines.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
