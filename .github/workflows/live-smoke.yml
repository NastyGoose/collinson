# Optional manual check against the real Open-Meteo APIs. It is not a PR gate:
# provider outages or changed live data can make it fail (SPEC-05).
name: Live smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: collinson
          POSTGRES_PASSWORD: collinson
          POSTGRES_DB: collinson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collinson -d collinson"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://collinson:collinson@localhost:5432/collinson
      PORT: 3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run db:migrate
      - run: npm run build

      - name: Start the app and run the README examples
        run: |
          node dist/main > app.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:3000/graphql -H 'content-type: application/json' \
              --data-binary @examples/health.json > /dev/null && break
            sleep 1
          done
          npm run smoke:live

      - name: App log
        if: always()
        run: cat app.log || true
